---
- name: Provisionar DNS
  hosts: dns
  become: true

  tasks:
    - name: Instalar Bind
      ansible.builtin.apt:
        name: bind9
        state: present
        update_cache: true

    - name: Copiar Opciones de Bind
      ansible.builtin.copy:
        src: files/ns1.olimpo.test/named.conf.options
        dest: /etc/bind/named.conf
        owner: root
        group: bind
        mode: "0644"

    - name: Reiniciar Bind
      ansible.builtin.service:
        name: bind9
        state: restarted
